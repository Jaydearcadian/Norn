[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "norn-asp"
version = "0.1.0"
description = "Verified capability to opportunity intelligence for OKX.AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
okx = ["okxweb3-app-x402[evm]==0.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
